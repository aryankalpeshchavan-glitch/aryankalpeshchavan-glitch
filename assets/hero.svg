<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 90) rotate(90) scale(180)">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(850 230) rotate(90) scale(180)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bgGrad)"/>
  <rect width="1000" height="320" fill="none" stroke="#1f2733" stroke-width="1"/>

  <circle cx="150" cy="90" r="130" fill="url(#glowPurple)" filter="url(#blurBig)">
    <animate attributeName="r" values="130;150;130" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="230" r="130" fill="url(#glowCyan)" filter="url(#blurBig)">
    <animate attributeName="r" values="130;150;130" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Consolas','Courier New',monospace" text-anchor="middle">
    <text x="500" y="118" font-size="15" letter-spacing="6" fill="#5b6472" opacity="0">
      &lt; DEVELOPER PROFILE /&gt;
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.8s" fill="freeze"/>
    </text>

    <text x="500" y="180" font-size="58" font-weight="700" fill="url(#textGrad)" opacity="0">
      Aryan Chavan
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.9s" fill="freeze"/>
    </text>

    <text x="500" y="220" font-size="22" fill="#c9d1d9" opacity="0">
      Aspiring DevOps Engineer
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
    </text>

    <text x="500" y="258" font-size="15" letter-spacing="1" fill="#8b96a5" opacity="0">
      Linux &#8226; Docker &#8226; Cloud &#8226; Python &#8226; Automation
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.9s" fill="freeze"/>
    </text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.9s" fill="freeze"/>
    <line x1="400" y1="278" x2="600" y2="278" stroke="url(#textGrad)" stroke-width="1.5"/>
  </g>
</svg>
