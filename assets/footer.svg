<svg width="1000" height="160" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbgGrad" x1="0" y1="0" x2="1000" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 30) rotate(90) scale(120 400)">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ftextGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="fblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1000" height="160" fill="url(#fbgGrad)"/>
  <circle cx="500" cy="20" r="90" fill="url(#fglow)" filter="url(#fblur)"/>

  <g font-family="'Consolas','Courier New',monospace" text-anchor="middle">
    <text x="500" y="70" font-size="24" font-weight="700" fill="url(#ftextGrad)">
      Thanks for stopping by 👋
    </text>
    <text x="500" y="104" font-size="14" fill="#8b96a5">
      Let's build something reliable, automated, and scalable together.
    </text>
    <line x1="430" y1="122" x2="570" y2="122" stroke="url(#ftextGrad)" stroke-width="1.5"/>
  </g>
</svg>
